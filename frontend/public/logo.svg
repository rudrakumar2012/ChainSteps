<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4cd7f6"/>
      <stop offset="1" stop-color="#3ba8c4"/>
    </linearGradient>
    <linearGradient id="step1" x1="8" y1="8" x2="8" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4edea3"/>
      <stop offset="1" stop-color="#3bba85"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="40" height="40" rx="10" fill="url(#bg)"/>
  <!-- Chain link (left) -->
  <path d="M12 14.5a2.5 2.5 0 1 1 0-5h3a2.5 2.5 0 1 1 0 5h-1.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- Chain link (right) -->
  <path d="M19 14.5h1.5a2.5 2.5 0 1 0 0-5h-3" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- Milestone steps ascending -->
  <rect x="9" y="22" width="5" height="4" rx="1" fill="#fff" opacity="0.5"/>
  <rect x="17" y="19" width="5" height="7" rx="1" fill="#fff" opacity="0.75"/>
  <rect x="25" y="16" width="5" height="10" rx="1" fill="url(#step1)"/>
  <!-- Checkmark on top step -->
  <path d="M26.5 21.5l1.5 1.5 2.5-3" stroke="#0b1326" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>